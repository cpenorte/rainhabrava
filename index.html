<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animação Rainha Irritada SVG/CSS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b2234 0%, #0d111a 100%);
      overflow: hidden;
    }

    .scene {
      width: 400px;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Animação de flutuação suave da rainha */
    .queen-body {
      animation: floatQueen 4s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes floatQueen {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    /* Animação de levitação sutil do cajado delicado da rainha */
    .wand-scepter-group {
      animation: floatWandScepter 4s ease-in-out infinite;
      animation-delay: -0.5s;
    }

    @keyframes floatWandScepter {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-14px) rotate(1.5deg);
      }
    }

    /* Animação das estrelinhas em tons de amarelo */
    .star-twinkle-1 {
      animation: twinkle 3s ease-in-out infinite;
    }
    .star-twinkle-2 {
      animation: twinkle 3s ease-in-out infinite 1s;
    }
    .star-twinkle-3 {
      animation: twinkle 3s ease-in-out infinite 2s;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.65;
        filter: drop-shadow(0 0 1px #eab308);
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 5px #fef08a);
      }
    }

    /* Partículas flutuantes em tons de amarelo */
    .particle-1 {
      animation: riseParticle 3.5s ease-in infinite;
    }
    .particle-2 {
      animation: riseParticle 4.2s ease-in infinite 1.2s;
    }
    .particle-3 {
      animation: riseParticle 3s ease-in infinite 2.1s;
    }
    .particle-4 {
      animation: riseParticle 3.8s ease-in infinite 0.6s;
    }

    @keyframes riseParticle {
      0% {
        transform: translateY(0px) scale(0.5);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: translateY(-45px) scale(1.1);
        opacity: 0;
      }
    }

    /* Sombra no chão acompanhando a flutuação */
    .floor-shadow {
      animation: shadowScale 4s ease-in-out infinite;
      transform-origin: 200px 415px;
    }

    @keyframes shadowScale {
      0%, 100% {
        transform: scaleX(1);
        opacity: 0.5;
      }
      50% {
        transform: scaleX(0.85);
        opacity: 0.3;
      }
    }
  </style>
</head>
<body>

  <div class="scene">
    <svg viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradiente do Vestido Imponente em Tons de Vermelho -->
        <linearGradient id="queenDressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#991b1b" />
          <stop offset="50%" stop-color="#e11d48" />
          <stop offset="100%" stop-color="#991b1b" />
        </linearGradient>

        <!-- Gradiente da Saia / Cauda Vermelha -->
        <linearGradient id="queenSkirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#be123c" />
          <stop offset="70%" stop-color="#9f1239" />
          <stop offset="100%" stop-color="#6b0f1a" />
        </linearGradient>

        <!-- Gradiente Dourado Delicado da Coroa, Colar e Cajado -->
        <linearGradient id="delicateGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef9c3" />
          <stop offset="45%" stop-color="#facc15" />
          <stop offset="85%" stop-color="#eab308" />
          <stop offset="100%" stop-color="#a16207" />
        </linearGradient>

        <!-- Estrelinha em tons de amarelo -->
        <polygon id="gold-star" points="0,-6 1.8,-1.8 6,0 1.8,1.8 0,6 -1.8,1.8 -6,0 -1.8,-1.8" fill="#facc15" />
      </defs>

      <!-- Sombra no chão -->
      <ellipse class="floor-shadow" cx="200" cy="415" rx="75" ry="12" fill="#05070c" />

      <!-- Grupo Principal da Rainha -->
      <g class="queen-body">

        <!-- Cabelos Negros Ajustados à Circunferência da Cabeça e Nuca -->
        <path d="M163 142 Q163 118 200 118 Q237 118 237 142 Q242 184 234 226 Q217 234 200 231 Q183 234 166 226 Q158 184 163 142 Z" fill="#090d16" />
        <!-- Reflexos sutis acompanhando o caimento natural -->
        <path d="M168 150 Q164 185 170 220" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
        <path d="M232 150 Q236 185 230 220" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

        <!-- Corpo / Vestido Imponente Vermelho com Detalhes Brancos -->
        <!-- Cauda / saia ampla -->
        <path d="M152 245 L112 390 L288 390 L248 245 Z" fill="url(#queenSkirtGrad)" />
        <!-- Painel central branco elegante no vestido -->
        <path d="M180 245 L166 390 L234 390 L220 245 Z" fill="#f8fafc" />
        <!-- Bordas vermelhas e douradas sobre o painel branco -->
        <path d="M180 245 L166 390" stroke="#e11d48" stroke-width="3" />
        <path d="M220 245 L234 390" stroke="#e11d48" stroke-width="3" />
        <path d="M200 250 L200 390" stroke="#eab308" stroke-width="2" stroke-dasharray="6 5" />

        <!-- Corpete / parte superior do vestido vermelho -->
        <path d="M158 196 L242 196 L248 250 Q200 264 152 250 Z" fill="url(#queenDressGrad)" />
        <!-- Detalhe branco e dourado na cintura / decote -->
        <path d="M153 246 Q200 259 247 246 L248 254 Q200 267 152 254 Z" fill="#ffffff" />
        <path d="M165 196 Q200 218 235 196" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
        <!-- Barra inferior do vestido com detalhe branco e dourado -->
        <path d="M114 380 L286 380 L288 390 L112 390 Z" fill="#ffffff" />
        <path d="M113 377 L287 377" stroke="#eab308" stroke-width="2.5" />

        <!-- Mangas elegantes do vestido com punhos brancos -->
        <path d="M158 198 Q126 232 142 272 L162 264 Q152 236 168 212 Z" fill="#be123c" />
        <path d="M140 266 L161 258 L164 265 L143 273 Z" fill="#ffffff" />
        <circle cx="153" cy="272" r="8.5" fill="#e8beaa" />

        <path d="M242 198 Q274 222 284 252 L265 259 Q257 234 232 212 Z" fill="#be123c" />
        <path d="M264 253 L283 246 L285 253 L266 260 Z" fill="#ffffff" />
        <circle cx="277" cy="256" r="8.5" fill="#e8beaa" />

        <!-- Colar Dourado Bonito com Pedras Preciosas -->
        <g>
          <path d="M174 196 Q200 222 226 196" fill="none" stroke="url(#delicateGoldGrad)" stroke-width="3.5" stroke-linecap="round" />
          <!-- Pingente central e pedras preciosas -->
          <polygon points="200,208 205,215 200,222 195,215" fill="#fef08a" stroke="#a16207" stroke-width="1.2" />
          <circle cx="200" cy="215" r="2.8" fill="#e11d48" />
          <circle cx="187" cy="208" r="2.5" fill="#38bdf8" stroke="#0369a1" stroke-width="0.6" />
          <circle cx="213" cy="208" r="2.5" fill="#38bdf8" stroke="#0369a1" stroke-width="0.6" />
        </g>

        <!-- Pescoço e Rosto Feminino Delicado -->
        <rect x="191" y="182" width="18" height="16" rx="6" fill="#e8beaa" />
        <path d="M169 130 Q200 124 231 130 Q233 162 224 178 Q212 191 200 191 Q188 191 176 178 Q167 162 169 130 Z" fill="#e8beaa" />

        <!-- Orelhas delicadas com brincos pequenos -->
        <circle cx="168" cy="161" r="5.5" fill="#dfa990" />
        <circle cx="232" cy="161" r="5.5" fill="#dfa990" />
        <circle cx="168" cy="168" r="2.2" fill="#facc15" />
        <circle cx="232" cy="168" r="2.2" fill="#facc15" />

        <!-- EXPRESSÃO BRAVA, IRRITADA E RÍSPIDA (SEM EXAGEROS) -->
        <!-- Sobrancelhas inclinadas para o centro com leve vinco de irritação -->
        <path d="M175 145 L194 151" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />
        <path d="M225 145 L206 151" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" />
        <path d="M198 148 L198 153 M202 148 L202 153" stroke="#c48b72" stroke-width="1.4" stroke-linecap="round" />

        <!-- Olhos firmes e semicerrados pela tensão -->
        <g>
          <!-- Olho esquerdo -->
          <ellipse cx="185" cy="157" rx="5.8" ry="3.8" fill="#ffffff" />
          <circle cx="185.5" cy="157" r="2.9" fill="#0f172a" />
          <circle cx="184.2" cy="155.8" r="1" fill="#ffffff" />
          <path d="M179 155 L191 155.8" fill="none" stroke="#090d16" stroke-width="2.2" stroke-linecap="round" />

          <!-- Olho direito -->
          <ellipse cx="215" cy="157" rx="5.8" ry="3.8" fill="#ffffff" />
          <circle cx="214.5" cy="157" r="2.9" fill="#0f172a" />
          <circle cx="213.2" cy="155.8" r="1" fill="#ffffff" />
          <path d="M209 155.8 L221 155" fill="none" stroke="#090d16" stroke-width="2.2" stroke-linecap="round" />
        </g>

        <!-- Nariz feminino pequeno e definido -->
        <path d="M200 156 L198.5 166 Q200 168 202.5 167" fill="none" stroke="#c48b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Boca fechada, séria e ríspida -->
        <g>
          <path d="M192 177 Q200 175.5 208 177" fill="none" stroke="#9f1239" stroke-width="2.3" stroke-linecap="round" />
          <path d="M194 179.5 Q200 178.5 206 179.5" fill="none" stroke="#e11d48" stroke-width="1.3" stroke-linecap="round" />
        </g>

        <!-- Franja / mechas frontais em cabelo negro emoldurando o rosto com suavidade -->
        <path d="M168 134 Q182 126 196 136 Q182 138 174 156 Q168 150 168 134 Z" fill="#090d16" />
        <path d="M232 134 Q218 126 204 136 Q218 138 226 156 Q232 150 232 134 Z" fill="#090d16" />

        <!-- COROA DELICADA AMPLIADA E DETALHADA COM DIAMANTES -->
        <g>
          <!-- Aro base dourado delicado -->
          <path d="M168 130 Q200 124 232 130 L229 138 Q200 132 171 138 Z" fill="url(#delicateGoldGrad)" stroke="#a16207" stroke-width="1.5" />

          <!-- Pontas ornamentadas e filigranas delicadas -->
          <path d="M170 131 L165 103 L177 119 L185 95 L193 118 L200 89 L207 118 L215 95 L223 119 L235 103 L230 131 Z" fill="url(#delicateGoldGrad)" stroke="#a16207" stroke-width="1.4" stroke-linejoin="round" />

          <!-- Detalhes em arco entre as pontas -->
          <path d="M170 126 Q177 116 183 126 Q189 114 195 126 Q200 112 205 126 Q211 114 217 126 Q223 116 230 126" fill="none" stroke="#fef9c3" stroke-width="1.2" />

          <!-- Diamantes reluzentes na coroa -->
          <polygon points="200,82 203.2,86.5 200,91 196.8,86.5" fill="#ffffff" stroke="#38bdf8" stroke-width="0.85" />
          <polygon points="185,89 187.5,92.8 185,96.5 182.5,92.8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.75" />
          <polygon points="215,89 217.5,92.8 215,96.5 212.5,92.8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.75" />
          <polygon points="165,97 167.2,100.3 165,103.5 162.8,100.3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.75" />
          <polygon points="235,97 237.2,100.3 235,103.5 232.8,100.3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.75" />

          <!-- Pequenos diamantes ao longo do aro -->
          <circle cx="179" cy="132" r="1.9" fill="#ffffff" />
          <circle cx="190" cy="130.8" r="2.1" fill="#e0f2fe" />
          <circle cx="200" cy="130.2" r="2.4" fill="#ffffff" />
          <circle cx="210" cy="130.8" r="2.1" fill="#e0f2fe" />
          <circle cx="221" cy="132" r="1.9" fill="#ffffff" />
        </g>

      </g>

      <!-- CAJADO MENOR E MAIS DELICADO DA RAINHA -->
      <g class="wand-scepter-group">
        <!-- Haste dourada fina e elegante -->
        <line x1="286" y1="196" x2="277" y2="365" stroke="#a16207" stroke-width="5" stroke-linecap="round" />
        <line x1="285.7" y1="196" x2="276.7" y2="365" stroke="url(#delicateGoldGrad)" stroke-width="2.8" stroke-linecap="round" />

        <!-- Detalhe ornamental delicado no topo -->
        <path d="M279 194 Q286 202 293 194" fill="none" stroke="url(#delicateGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="286" cy="180" r="10.5" fill="none" stroke="url(#delicateGoldGrad)" stroke-width="2.5" />

        <!-- Estrela/diamante delicado no topo do cajado -->
        <polygon points="286,166 289,174 297,177 289,180 286,188 283,180 275,177 283,174" fill="#fef08a" stroke="#a16207" stroke-width="1" />
        <polygon points="286,173 290,177 286,181 282,177" fill="#ffffff" />

        <!-- Pequena gema na base do cajado -->
        <circle cx="277" cy="368" r="3" fill="#facc15" stroke="#a16207" stroke-width="1" />
      </g>

      <!-- ESTRELINHAS E PARTÍCULAS EM TONS DE AMARELO AO REDOR DA RAINHA -->
      <g>
        <!-- Estrelinhas amarelas -->
        <use href="#gold-star" x="110" y="165" class="star-twinkle-1" transform="scale(1)" />
        <use href="#gold-star" x="272" y="118" class="star-twinkle-2" transform="scale(0.9)" />
        <use href="#gold-star" x="96" y="265" class="star-twinkle-3" transform="scale(1.1)" />
        <use href="#gold-star" x="318" y="235" class="star-twinkle-1" transform="scale(0.85)" />
        <use href="#gold-star" x="116" y="340" class="star-twinkle-2" transform="scale(0.95)" />
        <use href="#gold-star" x="312" y="325" class="star-twinkle-3" transform="scale(1)" />

        <!-- Partículas flutuantes amarelas -->
        <circle class="particle-1" cx="118" cy="215" r="3" fill="#facc15" />
        <circle class="particle-2" cx="268" cy="185" r="2.5" fill="#fef08a" />
        <circle class="particle-3" cx="102" cy="305" r="3.2" fill="#eab308" />
        <circle class="particle-4" cx="315" cy="285" r="2.8" fill="#fde047" />
      </g>

    </svg>
  </div>

</body>
</html>
